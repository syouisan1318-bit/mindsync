<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142d31">
<title>每日文章 · 同频者 MindSync</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#193238;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{background:#142d31;color:white;padding:24px}main{max-width:680px;margin:auto;padding:18px}a{color:inherit}article{background:white;border:1px solid #e2e8e4;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:26px}h2{font-size:21px;line-height:1.5}.meta{color:#618078;font-size:14px}.body{white-space:pre-line;line-height:1.85;overflow-wrap:anywhere}button{background:#176c60;color:white;padding:12px 16px;border:0;border-radius:10px;font:inherit}
</style>
</head>
<body>
<header><a href="./">返回同频者首页</a><h1>每日思想文章</h1></header>
<main><p id="status" role="status">正在加载文章…</p><button id="refresh" type="button">刷新文章</button><div id="articles"></div></main>
<script>
'use strict';
const statusEl=document.getElementById('status'),feed=document.getElementById('articles'),refresh=document.getElementById('refresh');
async function load(){
refresh.disabled=true;
try{
const response=await fetch('./articles.json?t='+Date.now(),{cache:'no-store'});
if(!response.ok)throw new Error('HTTP '+response.status);
const data=await response.json();
if(!Array.isArray(data))throw new Error('文章数据格式错误');
const items=data.filter(a=>a&&typeof a.content==='string'&&(a.title||a.topic)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
const fragment=document.createDocumentFragment();
for(const [i,a] of items.entries()){
const article=document.createElement('article');
const meta=document.createElement('p');meta.className='meta';meta.textContent=(i===0?'最新文章':'历史文章')+' · '+(a.date||'');
const title=document.createElement('h2');title.textContent=a.title||a.topic;
const body=document.createElement('div');body.className='body';body.textContent=a.content;
article.append(meta,title,body);
if(a.question){const q=document.createElement('p');q.textContent=a.question;article.append(q);}
fragment.append(article);
}
feed.replaceChildren(fragment);
statusEl.textContent=items.length?'已发布 '+items.length+' 篇 · 最新日期 '+items[0].date:'暂无已发布文章';
}catch(e){statusEl.textContent='文章暂时无法加载，请点击刷新重试。';console.error(e);}
finally{refresh.disabled=false;}
}
refresh.addEventListener('click',load);load();
</script>
</body></html>
