
name: MindSync Daily Topics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: mindsync-daily-topics
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish daily article
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import pathlib

          today = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))
          ).date()

          articles = [
              (
                  "如果财富自由了，你还会继续创业吗？",
                  """财富自由常被描述为终点：不再为账单焦虑，也不必接受不喜欢的工作。但当生存压力消失，另一个问题就会出现：我们究竟想把时间交给什么？

          创业可能是赚钱的手段，也可能是一种表达方式。有人享受从零建立产品的过程，有人喜欢解决复杂问题，也有人只是想证明自己。前两种动力在财富自由后仍然存在，最后一种却可能让人永远无法满足。

          值得区分的是自由与忙碌。能够选择不做，才更接近自由；被成就感驱赶到无法停下，并不比被工资束缚轻松。创业者不妨试着问自己：如果明天不再需要收入，我还愿意做哪些工作？答案也许比资产数字更能说明自己是谁。"""
              ),
              (
                  "独立思考是否意味着必须质疑多数人的观点？",
                  """独立思考不是习惯性反对。多数人的意见可能正确，也可能只是未经检验的共识；少数人的观点同样可能深刻或荒谬。真正重要的不是站在哪一边，而是判断依据能否经受检验。

          一个实用的方法是把事实、解释和价值判断分开。比如一家企业销量下降是事实；归因于产品不佳是一种解释；认为它应当裁员则是价值与策略选择。把三者混在一起，讨论就容易变成情绪较量。

          独立思考也意味着允许自己改变主意。我们应主动寻找最有力的反对证据，而不是只搜集支持自己的材料。承认不确定性并不软弱，反而能避免把自尊绑在某个结论上。真正的独立，是有能力在证据改变时更新判断。"""
              ),
              (
                  "人生的意义是发现的，还是自己创造的？",
                  """有些人相信人生存在等待发现的使命；另一些人认为意义来自每天的选择。两种看法未必完全冲突。我们可以从关系、天赋与经历中发现重要线索，同时通过行动把它们变成真实的生活。

          意义不一定是一项宏大的事业。认真养育孩子、帮助一位朋友、把一门手艺练到精湛，都可能构成稳定而具体的意义。它往往不是在空想中突然降临，而是在长期投入后逐渐清晰。

          困难在于社会经常用收入、名望和速度衡量成功。但外部评价无法替我们回答：哪些事情值得付出有限的生命？与其追问唯一正确的人生答案，不如记录那些让自己愿意承担责任的时刻，再观察它们指向什么。"""
              ),
              (
                  "自由与财富之间，究竟是什么关系？",
                  """财富能够扩大选择范围：让人更容易拒绝不合理的工作，照顾家人，或承受一次创业失败。但财富并不自动带来自由。一个收入很高却无法停止比较的人，可能仍被欲望牵引。

          自由至少包含三个维度：时间是否由自己支配，决定是否符合自己的价值，以及能否承担选择的后果。金钱对第一和第三个维度帮助明显，对第二个维度却没有保证。

          因此，追求财富时不妨同时计算隐藏成本：健康、关系、注意力和机会成本。更多收入值得争取，但如果每次增长都必须牺牲所有可支配时间，最终得到的可能只是更昂贵的束缚。好的财务目标应服务于生活，而不是取代生活。"""
              ),
              (
                  "人性是由环境塑造，还是由选择决定？",
                  """环境会改变一个人能看到的机会，也会影响行为的代价。成长经历、教育资源与社会规则并不公平，因此简单地把一切归因于个人选择，容易忽略真实限制。

          但承认环境的重要，不等于否认行动的力量。在相似处境中，人仍可能采取不同策略：有人重复熟悉的模式，有人寻找新的关系与知识。选择不是无条件的自由，而是在限制之内寻找可改变的部分。

          理解人性时，应避免两个极端：一是认为人人完全由环境决定，二是认为成功失败全靠意志。更有帮助的问题是：哪些条件限制了行动？哪些能力可以训练？哪些制度可以改善？这样的分析既保留同情，也保留责任。"""
              ),
              (
                  "创业最大的收获是财富，还是对自己的认识？",
                  """创业会放大一个人的优点，也暴露弱点。产品卖不出去时，我们可能发现自己过度自信；合作出现分歧时，才看见沟通能力的不足；现金流紧张时，才知道风险承受能力与想象不同。

          财富是重要的成果，但它受到市场时机、行业结构和运气影响。把收入当作唯一成绩单，容易忽视那些可迁移的能力：识别需求、管理现金、建立信任、快速修正错误。

          反思不能只是给失败寻找漂亮解释。真正的自我认识需要证据：原来的预测是什么？实际结果是什么？哪些判断错了？下一次如何调整？记录这些问题，才能把经历转化为能力。创业是否值得，不能只看结局，也要看它让我们成为什么样的人。"""
              ),
              (
                  "什么样的交流才算真正有深度？",
                  """深度交流不等于使用艰深的词汇，也不等于争论到对方认输。它始于对问题的共同好奇，以及愿意理解彼此观点背后的经验与理由。

          一个常见障碍是我们急着回应，却没有确认自己是否听懂。与其马上反驳，不如先复述对方的核心意思，再问：你为什么这样判断？有没有什么经历让你改变看法？这些问题往往比表达立场更有力量。

          深度也需要边界。不是每次聊天都必须谈论人生与社会；轻松和沉默同样重要。真正有价值的对话，是让双方离开时对世界多了一点理解，对自己的盲点多了一点觉察，而不是只记得谁赢了。"""
              )
          ]

          title, body = articles[today.toordinal() % len(articles)]
          record = {
              "date": str(today),
              "topic": title,
              "title": title,
              "content": body,
              "question": "你会如何回答今天的主题？"
          }

          pathlib.Path("daily-topic.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          folder = pathlib.Path("articles")
          folder.mkdir(exist_ok=True)

          (folder / f"{today}.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          archive = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in sorted(folder.glob("*.json"), reverse=True)
          ]

          pathlib.Path("articles.json").write_text(
              json.dumps(archive, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Published:", today, title)
          PY

      - name: Save published article
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-topic.json articles/ articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish MindSync daily article"
            git push
          fi

